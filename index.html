<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII City - Times Square</title>
  <style>
    html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #screen { display:block; width:100vw; height:100vh; background:#000; image-rendering:pixelated; }
    #hud { position:fixed; bottom:8px; left:50%; transform:translateX(-50%); color:#fff; font:12px monospace; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:4px; pointer-events:none; }
    #settings-panel { position:fixed; top:16px; left:16px; width:290px; z-index:10;
      background:rgba(8,10,18,0.94); color:#cfd6e6; font:12px monospace;
      padding:10px 12px; border:1px solid #2a3145; border-radius:6px; display:none; }
    #settings-panel h3 { margin:0 0 8px; font-size:13px; color:#ffe14d; font-weight:normal; letter-spacing:1px; }
    #settings-panel .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0; }
    #settings-panel label { flex:1; }
    #settings-panel input[type=range] { width:110px; accent-color:#ffe14d; }
    #settings-panel input[type=checkbox] { accent-color:#ffe14d; }
    #settings-panel select { background:#131722; color:#cfd6e6; border:1px solid #2a3145; font:12px monospace; }
    #settings-panel .hint { color:#7b8497; margin-top:9px; font-size:11px; }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="hud">WASD move · ←→ turn · ↑↓ look · M map · L lamps · F fly · P settings</div>
  <script src="city-generator.js"></script>
  <script src="settings.js"></script>
  <script src="traffic.js"></script>
  <script src="facade.js"></script>
  <script src="weather.js"></script>
  <script src="audio.js"></script>
  <script src="main.js"></script>
</body>
</html>
